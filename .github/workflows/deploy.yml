
name: Build and Deploy Docker

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: hello-world-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 1. Authenticate to AWS using the credentials stored in GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build the image using the multi-stage Dockerfile and push it
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # 4. Configure SSH to EC2
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # 5. Pull the new image and deploy the container
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$IMAGE_URI' '$AWS_REGION'" <<'REMOTE'
          set -Eeuo pipefail

          IMAGE_URI="$1"
          AWS_REGION="$2"
          REGISTRY="${IMAGE_URI%%/*}"
          CONTAINER_NAME="hello-world-api"

          # Remember the previous Docker image for rollback.
          OLD_IMAGE=$(sudo docker inspect \
            --format='{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)

          # Authenticate EC2 to ECR and pull the new image.
          aws ecr get-login-password --region "$AWS_REGION" |
            sudo docker login --username AWS --password-stdin "$REGISTRY"

          sudo docker pull "$IMAGE_URI"

          # Stop the old JAR-based systemd service during the migration.
          sudo systemctl stop myapp || true

          rollback() {
            echo "Deployment failed; rolling back"

            sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

            if [ -n "$OLD_IMAGE" ]; then
              sudo docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p 127.0.0.1:8080:8080 \
                "$OLD_IMAGE"
            else
              # First Docker deployment: fall back to the existing JAR.
              sudo systemctl start myapp || true
            fi
          }

          # Remove the previous container, if one exists.
          sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          # Start the new version.
          if ! sudo docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE_URI"; then
            rollback
            exit 1
          fi

          # Health check: wait up to 40 seconds.
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ -o /dev/null; then
              echo "Deployment successful: $IMAGE_URI"
              sudo systemctl disable myapp || true
              exit 0
            fi
            sleep 2
          done

          # Health check failed: restore the previous version.
          rollback
          sudo journalctl -u myapp -n 80 --no-pager || true
          sudo docker logs --tail 80 "$CONTAINER_NAME" || true
          exit 1
          REMOTE
