
name: Build and Deploy Docker

on:
  push:
    branches:
      - main

# Stage 6: Prevent concurrent production deployments.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: hello-world-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Stage 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Stage 2: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Stage 3: Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Stage 4: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      # Stage 5a: Configure SSH to EC2
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      # Stage 5b: Health check and rollback
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$IMAGE_URI' '$AWS_REGION'" <<'REMOTE'
          set -Eeuo pipefail

          IMAGE_URI="$1"
          AWS_REGION="$2"
          REGISTRY="${IMAGE_URI%%/*}"
          CONTAINER_NAME="hello-world-api"
          CANDIDATE_NAME="hello-world-api-candidate"

          # Remember the existing production image.
          OLD_IMAGE=$(sudo docker inspect \
            --format='{{.Config.Image}}' "$CONTAINER_NAME" 2>/dev/null || true)

          # Authenticate to ECR and download the new image.
          aws ecr get-login-password --region "$AWS_REGION" |
            sudo docker login --username AWS --password-stdin "$REGISTRY"

          sudo docker pull "$IMAGE_URI"

          # Start candidate on port 8081.
          # The production container on port 8080 remains untouched.
          sudo docker rm -f "$CANDIDATE_NAME" >/dev/null 2>&1 || true

          if ! sudo docker run -d \
            --name "$CANDIDATE_NAME" \
            -p 127.0.0.1:8081:8080 \
            "$IMAGE_URI"; then
            echo "Candidate failed to start. Production remains unchanged."
            exit 1
          fi

          # Health check candidate for up to 40 seconds.
          HEALTHY=false

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8081/ -o /dev/null; then
              HEALTHY=true
              break
            fi

            if ! sudo docker inspect \
              --format='{{.State.Running}}' "$CANDIDATE_NAME" |
              grep -q true; then
              echo "Candidate container exited unexpectedly."
              break
            fi

            sleep 2
          done

          # Candidate failed: remove only candidate.
          if [ "$HEALTHY" != "true" ]; then
            echo "Health check failed. Keeping production unchanged."
            sudo docker logs --tail 80 "$CANDIDATE_NAME" || true
            sudo docker rm -f "$CANDIDATE_NAME" || true
            exit 1
          fi

          echo "Candidate is healthy. Promoting new version."

          rollback() {
            echo "Production deployment failed. Rolling back."

            sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

            if [ -n "$OLD_IMAGE" ]; then
              sudo docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p 127.0.0.1:8080:8080 \
                "$OLD_IMAGE"
            else
              # First Docker deployment: fall back to the JAR service.
              sudo systemctl start myapp || true
            fi
          }

          # Replace production only after candidate passes health check.
          sudo systemctl stop myapp || true
          sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          if ! sudo docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p 127.0.0.1:8080:8080 \
            "$IMAGE_URI"; then
            rollback
            sudo docker rm -f "$CANDIDATE_NAME" >/dev/null 2>&1 || true
            exit 1
          fi

          # Verify production after promotion.
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ -o /dev/null; then
              sudo docker rm -f "$CANDIDATE_NAME" >/dev/null 2>&1 || true
              sudo systemctl disable myapp || true
              echo "Deployment successful: $IMAGE_URI"
              exit 0
            fi
            sleep 2
          done

          # Production health check failed: restore the previous image.
          sudo docker logs --tail 80 "$CONTAINER_NAME" || true
          rollback
          sudo docker rm -f "$CANDIDATE_NAME" >/dev/null 2>&1 || true
          exit 1
          REMOTE
