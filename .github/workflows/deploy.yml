
name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn -B clean package

      - name: Find executable JAR
        id: jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No executable JAR found in target/"
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload versioned JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "mkdir -p /home/ec2-user/releases"

          scp -i ~/.ssh/deploy_key \
            "${{ steps.jar.outputs.path }}" \
            "$EC2_USER@$EC2_HOST:/home/ec2-user/releases/${RELEASE_VERSION}.jar"

      - name: Deploy and restart application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$RELEASE_VERSION'" <<'REMOTE'
          set -e

          APP_DIR="/home/ec2-user"
          VERSION="$1"
          OLD_TARGET=$(readlink "$APP_DIR/app.jar")

          if [ -z "$OLD_TARGET" ]; then
            echo "ERROR: app.jar must be a symlink before deployment."
            exit 1
          fi

          switch_release() {
            ln -sfn "$1" "$APP_DIR/app.jar.next"
            mv -Tf "$APP_DIR/app.jar.next" "$APP_DIR/app.jar"
          }

          # Switch to the new release
          switch_release "releases/$VERSION.jar"

          # Restart; restore the old release if restart fails
          if ! sudo systemctl restart myapp; then
            echo "Restart failed; rolling back"
            switch_release "$OLD_TARGET"
            sudo systemctl restart myapp || true
            exit 1
          fi

          # Health check: wait up to 40 seconds
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ -o /dev/null; then
              echo "Deployment successful: $VERSION"
              exit 0
            fi
            sleep 2
          done

          # Health check failed; restore the previous release
          echo "Health check failed; rolling back"
          switch_release "$OLD_TARGET"
          sudo systemctl restart myapp || true
          sudo journalctl -u myapp -n 80 --no-pager
          exit 1
          REMOTE
