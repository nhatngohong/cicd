
name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn -B clean package

      - name: Find executable JAR
        id: jar
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.original' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No executable JAR found in target/"
            exit 1
          fi
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            "${{ steps.jar.outputs.path }}" \
            "$EC2_USER@$EC2_HOST:/home/ec2-user/app.jar.new"

      - name: Deploy and restart application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" '
            set -e
            mv /home/ec2-user/app.jar /home/ec2-user/app.jar.previous
            mv /home/ec2-user/app.jar.new /home/ec2-user/app.jar
            if sudo systemctl restart myapp; then
              echo "Application restarted"
            else
              echo "Restart failed; restoring previous JAR"
              mv /home/ec2-user/app.jar.previous /home/ec2-user/app.jar
              sudo systemctl restart myapp || true
              exit 1
            fi

            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8080/ -o /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed; inspect systemd logs"
            sudo journalctl -u myapp -n 80 --no-pager
            exit 1
          '
